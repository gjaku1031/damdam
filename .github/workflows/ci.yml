name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Spring Boot API: Java 25 + Gradle 캐시
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 웹 타입 검사, API 컴파일과 주석 컨벤션 검사(scripts/check-javadoc.py)
      - name: Lint and typecheck
        run: pnpm lint

      - name: Build
        run: pnpm build
