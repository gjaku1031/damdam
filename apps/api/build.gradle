// Java·Spring Boot·jOOQ 빌드 플러그인
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'org.jooq.jooq-codegen-gradle' version '3.21.8'
    id 'io.spring.dependency-management' version '1.1.7'
}

// 배포 좌표와 jOOQ 버전
group = 'io.github.gjaku1031'
version = '0.1.0'
ext['jooq.version'] = '3.21.8'

repositories { mavenCentral() }

// JDK·바이트코드 버전과 Spring의 매개변수 이름 조회 지원
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-parameters', '-Xlint:deprecation'])
}

springBoot { mainClass = 'io.github.gjaku1031.damdam.DamdamApiApplication' }

dependencies {
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
    implementation 'org.flywaydb:flyway-database-postgresql'
    // PHC 형식 해시를 검증하는 Argon2id 구현
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    // 본문 HTML 정제·변환
    implementation 'org.jsoup:jsoup:1.23.2'
    runtimeOnly 'org.postgresql:postgresql'

    jooqCodegen 'org.jooq:jooq-meta-extensions:3.21.8'
}

sourceSets {
    main { java.srcDir 'build/generated-src/jooq/main' }
}

// Flyway 기준 스키마에서 jOOQ 테이블 타입 생성; DB 연결 불필요
def baselineSchema = file('src/main/resources/db/migration')
jooq {
    configuration {
        generator {
            name = 'org.jooq.codegen.JavaGenerator'
            database {
                name = 'org.jooq.meta.extensions.ddl.DDLDatabase'
                inputSchema = 'PUBLIC'
                outputSchemaToDefault = true
                forcedTypes {
                    forcedType { name = 'INSTANT'; includeTypes = '(?i:TIMESTAMP\\ WITH\\ TIME\\ ZONE)' }
                    // DDLDatabase(H2)가 jsonb를 JSON으로 해석하므로 PostgreSQL 타입으로 복원
                    forcedType { name = 'JSONB'; includeExpression = '.*\\.admin_updates\\.(documentJson|draft|tags)' }
                }
                properties {
                    property { key = 'scripts'; value = baselineSchema.absolutePath + '/*.sql' }
                    property { key = 'sort'; value = 'flyway' }
                    property { key = 'unqualifiedSchema'; value = 'none' }
                    property { key = 'defaultNameCase'; value = 'as_is' }
                    property { key = 'parseIgnoreComments'; value = 'true' }
                    property { key = 'parseUnknownFunctions'; value = 'IGNORE' }
                }
            }
            generate {
                pojos = false
                daos = false
                records = true
                implicitJoinPathsToOne = false
                implicitJoinPathsToMany = false
                implicitJoinPathsManyToMany = false
            }
            target {
                packageName = 'io.github.gjaku1031.damdam.jooq'
                directory = 'build/generated-src/jooq/main'
            }
        }
    }
}
tasks.named('jooqCodegen') { inputs.dir(baselineSchema) }
tasks.named('compileJava') { dependsOn tasks.named('jooqCodegen') }

tasks.named('bootJar') { archiveFileName = 'damdam-api.jar' }
tasks.named('jar') { enabled = false }
